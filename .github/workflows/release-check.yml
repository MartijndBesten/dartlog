name: OKKIE release checks
# Volledige browsertests (iPhone, Android, desktop) en de echte update 1.3.0 → nieuwe versie,
# in GitHub Actions zodat de laptop niet zwaar belast wordt.
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: Browsertests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [iphone, android, desktop]
    env:
      CI: "true"
      PW_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: App, community, kinderuitleg en gebouwde website
        run: npx playwright test --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  upgrade:
    name: Update vanaf de live versie (main) met bestaande gegevens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PW_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Live versie (origin/main) apart uitpakken
        run: |
          git worktree add ../okkie-live origin/main
          grep -o "const VERSION = '[^']*'" ../okkie-live/sw.js sw.js
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Spelers, trainingen, lopende training, statistieken, cache en offline na update
        run: node tools/upgrade-check.mjs ../okkie-live
