# OKKIE. website (okkiedarts.nl): Cloudflare Worker met statische bestanden uit dist/ (npm run build:site).
# Bewust los van de API-Worker (cloud/). Geen app, geen opslag, geen geheimen.
# Voorbeeld (zonder domein):  npx wrangler deploy -c site/wrangler.toml
# Productie (zone actief):     npx wrangler deploy -c site/wrangler.toml --env production
name = "okkiedarts-site"
main = "../ontdek/pages-worker.js"
compatibility_date = "2026-10-10"
workers_dev = true

[assets]
directory = "../dist"
binding = "ASSETS"
# Eerst de worker: www/http-doorverwijzing en beveiligingsheaders, daarna de bestanden.
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[env.production]
name = "okkiedarts-site"
workers_dev = false
routes = [
  { pattern = "okkiedarts.nl", custom_domain = true },
  { pattern = "www.okkiedarts.nl", custom_domain = true },
]

[env.production.assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "none"
