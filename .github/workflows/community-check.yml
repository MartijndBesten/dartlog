name: OKKIE community checks
on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**', feature/okkie-public-community, infra/cloudflare-community]
  pull_request:
    paths:
      - 'cloud/**'
      - 'community/**'
      - 'ontdek/**'
      - 'js/**'
      - 'tests/unit/**'
      - '.github/workflows/community-check.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (voor de API-integratietests) is stabiel vanaf Node 24.
          node-version: '24'
      - name: Source syntax check
        run: |
          node --check cloud/src/worker.js
          node --check community/app.js
          node --check js/community-sync.js
          node --check js/app.js
      - name: Prepare static website and verify admin template
        run: |
          node cloud/tools/build-admin-page.mjs
          git diff --exit-code -- cloud/src/admin-page.js
          npm run build:site
          node --input-type=module -e "import{existsSync}from'node:fs'; for(const f of ['dist/index.html','dist/site.js','dist/uitleg/index.html','dist/uitleg/uitleg.js'])if(!existsSync(f))throw Error(f); if(existsSync('dist/app'))throw Error('geen tweede app op okkiedarts.nl')"
      - name: Existing app unit tests
        run: npm test
      - name: Community API tests (node:sqlite, no Cloudflare account needed)
        working-directory: cloud
        run: node --test tests/*.test.js
      - name: Validate Worker config and bundle (dry run, no account needed)
        working-directory: cloud
        run: |
          npm ci --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir dist
          npx wrangler deploy --dry-run --outdir dist --env production
