name = "okkie-community-api"
main = "src/worker.js"
compatibility_date = "2026-10-10"

# API en beheerscherm zijn twee hostnamen naar DEZELFDE Worker.
# Vereist een actieve Cloudflare-zone voor okkiedarts.nl. Voer pas na akkoord een deploy uit.
workers_dev = true

[[routes]]
pattern = "api.okkiedarts.nl"
custom_domain = true

[[routes]]
pattern = "beheer.okkiedarts.nl"
custom_domain = true

[vars]
ALLOWED_ORIGINS = "https://okkiedarts.nl,https://www.okkiedarts.nl,https://martijndbesten.github.io"
ADMIN_HOST = "beheer.okkiedarts.nl"

# Cloudflare Access-instellingen en beheerderadressen gaan als Worker secrets,
# zodat een latere wrangler deploy ze niet door lege [vars] overschrijft.
# npx wrangler secret put CF_ACCESS_TEAM_DOMAIN
# npx wrangler secret put CF_ACCESS_AUD
# npx wrangler secret put ADMIN_ALLOWED_EMAILS

# Cloudflare secret (nooit naar GitHub committen):
# TURNSTILE_SECRET (instellen met npx wrangler secret put TURNSTILE_SECRET)

[[d1_databases]]
binding = "DB"
database_name = "okkie-community"
database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"
migrations_dir = "migrations"
