name: OKKIE iPhone-app
# De echte iPhone-app (Capacitor) bouwen op een macOS-runner van GitHub (gratis voor deze openbare repository).
# - Elke push: compileren voor de simulator en de rooktest (tools/ios/smoke.sh): starten, gegevens terugzetten,
#   kopie schrijven, herstel na het wissen van de webviewopslag.
# - Alleen met de hand (Actions → OKKIE iPhone-app → Run workflow, "TestFlight" aan): ondertekenen en uploaden
#   naar TestFlight. Nooit naar de openbare App Store: dat blijft een handmatige stap van de eigenaar.
on:
  push:
    branches: [main, 'claude/ios-**', 'feature/**']
    paths:
      - 'ios/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'community/**'
      - 'uitleg/**'
      - 'vrienden/**'
      - 'icons/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/app-files.mjs'
      - 'tools/build-ios-web.mjs'
      - 'tools/ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Ondertekenen en uploaden naar TestFlight'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
env:
  BUNDLE_ID: nl.denckh.okkie
  TEAM_ID: W9H8R7BPDN

jobs:
  simulator:
    name: Compileren en rooktest (simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || xcode-select -p)" || true
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true
      - name: Webbestanden in de app (dist-ios) en Capacitor sync
        run: node tools/build-ios-web.mjs && npx cap sync ios
      - name: Compileren voor de simulator
        run: |
          xcodebuild -list -project ios/App/App.xcodeproj
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee build.log | grep -E "error:|warning: .*OKKIE|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Rooktest in de simulator
        run: tools/ios/smoke.sh build/Build/Products/Debug-iphonesimulator/App.app smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-rooktest
          path: |
            smoke/
            build.log
          retention-days: 14

  testflight:
    name: TestFlight
    needs: simulator
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      RUN_ID: ${{ github.run_id }}
      SIGN: ${{ runner.temp }}/sign
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || xcode-select -p)" || true
          xcodebuild -version
      - name: App bestaat in App Store Connect?
        run: node tools/ios/asc-signing.mjs app
      - name: Tijdelijk certificaat en profiel
        run: |
          mkdir -p "$SIGN"
          openssl req -new -newkey rsa:2048 -nodes -keyout "$SIGN/key.pem" -out "$SIGN/csr.pem" -subj "/CN=OKKIE CI/O=Denckh/C=NL"
          node tools/ios/asc-signing.mjs prepare "$SIGN/csr.pem" "$SIGN"
          openssl x509 -inform DER -in "$SIGN/distribution.cer" -out "$SIGN/distribution.pem"
          P12PASS=$(openssl rand -hex 16)
          openssl pkcs12 -export -legacy -inkey "$SIGN/key.pem" -in "$SIGN/distribution.pem" -out "$SIGN/dist.p12" -passout pass:$P12PASS
          KC="$SIGN/okkie.keychain-db"; KCPASS=$(openssl rand -hex 16)
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          curl -fsSL -o "$SIGN/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$SIGN/wwdr.cer" -k "$KC" -T /usr/bin/codesign || true
          security import "$SIGN/dist.p12" -k "$KC" -P "$P12PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          UUID=$(security cms -D -i "$SIGN/profile.mobileprovision" | plutil -extract UUID raw -)
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$SIGN/profile.mobileprovision" "$d/$UUID.mobileprovision"; done
          echo "PROFILE_NAME=$(node -p "require('$SIGN/ids.json').profileName")" >> "$GITHUB_ENV"
          mkdir -p "$HOME/private_keys"; printf '%s' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Webbestanden en Capacitor sync
        run: node tools/build-ios-web.mjs && npx cap sync ios
      - name: Archief maken (Release, Apple Distribution)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          python3 tools/ios/manual-signing.py ios/App/App.xcodeproj/project.pbxproj "$PROFILE_NAME" "$TEAM_ID"
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/OKKIE.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
      - name: Uploaden naar TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/OKKIE.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee export.log | grep -Ei "error|upload|EXPORT (SUCCEEDED|FAILED)" || true
          grep -qE "EXPORT SUCCEEDED|Upload succeeded" export.log
          echo "Build ${{ github.run_number }} staat in App Store Connect; na verwerking (5-30 min) verschijnt hij in TestFlight."
      - name: Opruimen (certificaat intrekken, sleutel weg)
        if: always()
        run: |
          node tools/ios/asc-signing.mjs cleanup "$SIGN" || true
          security delete-keychain "$SIGN/okkie.keychain-db" 2>/dev/null || true
          rm -rf "$SIGN" "$HOME/private_keys"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-logs
          path: |
            archive.log
            export.log
          retention-days: 14
