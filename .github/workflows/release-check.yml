name: OKKIE release checks
# Volledige browsertests (iPhone, Android, desktop) en de echte update 1.3.0 → nieuwe versie,
# in GitHub Actions zodat de laptop niet zwaar belast wordt.
on:
  push:
    branches: [main, 'release/**', 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: Browsertests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [iphone, android, desktop]
    env:
      CI: "true"
      PW_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: App, community, kinderuitleg en gebouwde website
        run: npx playwright test --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  upgrade:
    name: Update vanaf de live versie (main) met bestaande gegevens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PW_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Vorige versie (laatste commit met een andere VERSION in sw.js) apart uitpakken
        id: live
        run: |
          # Altijd vergelijken met de vorige versie: de laatste commit in de geschiedenis waarin sw.js een andere
          # VERSION had. Zo meet de controle ook iets als main al is bijgewerkt (vergelijken met zichzelf zei niets).
          NEW=$(grep -o "const VERSION = '[^']*'" sw.js)
          OLD=""
          for c in $(git log --format=%H HEAD -- sw.js); do
            if [ "$(git show "$c:sw.js" | grep -o "const VERSION = '[^']*'")" != "$NEW" ]; then OLD=$c; break; fi
          done
          if [ -z "$OLD" ]; then
            echo "Geen vorige versie gevonden; updatecontrole overgeslagen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Vorige versie: $(git log --oneline -1 "$OLD")"
          git worktree add ../okkie-live "$OLD"
          grep -o "const VERSION = '[^']*'" ../okkie-live/sw.js sw.js
      - if: steps.live.outputs.skip != 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.live.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium
      - name: Spelers, trainingen, lopende training, statistieken, cache en offline na update
        if: steps.live.outputs.skip != 'true'
        run: node tools/upgrade-check.mjs ../okkie-live
