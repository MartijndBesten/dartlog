# OKKIE. Community API — Cloudflare Worker + D1.
# Twee omgevingen (stand 24-10-2026, gecontroleerd met `wrangler versions view`):
#   (standaard)       STAGING: Worker "okkie-api-staging" (tot 24-10 heette die "okkie-community-api"), eigen D1
#                     "okkie-community-staging". Geen app of website roept staging aan; alleen voor proefdeploys.
#   --env production  PRODUCTIE: Worker "okkie-api" (https://okkie-api.<account-subdomein>.workers.dev, zie
#                     community/config.js PROD_API), D1 "okkie-community" = de echte gebruikersgegevens.
#                     api.okkiedarts.nl kan pas als de Cloudflare-zone okkiedarts.nl actief is (nameservers); dat is
#                     bewust niet gedaan (DNSSEC bij STRATO).
# Uitrollen en migreren ALTIJD via de expliciete scripts in package.json (deploy:staging / deploy:production,
# migrate:staging / migrate:production); tests/omgevingen.test.js bewaakt dat productie nooit de staging-D1 bindt.
# Spelers jonger dan 16: alleen met MINORS_OPEN = "true" (na juridische toets en DPIA, VRIENDEN.md §4); nu nergens gezet.
# Secrets (nooit in Git), per omgeving met `npx wrangler secret put <NAAM> [--env production]`:
#   TURNSTILE_SECRET
#   CF_ACCESS_TEAM_DOMAIN, CF_ACCESS_AUD, ADMIN_ALLOWED_EMAILS  (alleen production; zonder deze is beheer dicht)
# Access-instellingen staan bewust als secrets, zodat een latere deploy ze niet met lege [vars] overschrijft.
name = "okkie-api-staging"
main = "src/worker.js"
compatibility_date = "2026-10-10"
workers_dev = true

[observability]
enabled = true

# Dagelijkse opschoning volgens de bewaartermijnen (03:30 UTC).
[triggers]
crons = ["30 3 * * *"]

[vars]
# Meerdere origins gescheiden met komma; de bestaande PWA-origin blijft altijd nodig.
ALLOWED_ORIGINS = "https://app.okkiedarts.nl,https://martijndbesten.github.io,https://okkiedarts.nl,https://www.okkiedarts.nl,capacitor://localhost,http://localhost:4173,http://127.0.0.1:4173,https://okkie-app-staging.zaalverhuur-sion.workers.dev"
# Openbare registratie dicht tot privacyverklaring + ouderlijke toestemming (<16) geregeld zijn. Alleen "true" opent.
REGISTRATION_ENABLED = "false"
# Mijn vrienden (besloten groepen) uit sinds 1.5.0; gegevens blijven bewaard. Darters (openbaar, één schakelaar) aan.
GROUPS_ENABLED = "false"
DARTERS_ENABLED = "true"
# OKKIE. Club (cloud/CLUB.md): op staging aan om te testen; aanmaken alleen met een proefclubcode (secret CLUB_PILOT_CODES).
CLUBS_ENABLED = "true"
EMPTY_ACCOUNT_DAYS = "30"
INACTIVE_DAYS = "730"

[[d1_databases]]
binding = "DB"
database_name = "okkie-community-staging"
database_id = "ddf81dd7-c1e8-4482-8e5b-75d485966e8b"
migrations_dir = "migrations"

# Rate limiting (per IP bij registratie/herstel, per account bij wijzigingen).
[[ratelimits]]
name = "RL_REGISTER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# ---------------------------------------------------------------------------
# Productie: Worker "okkie-api" op workers.dev (https://okkie-api.<account-subdomein>.workers.dev).
# Later naar api.okkiedarts.nl: pas als de Cloudflare-zone okkiedarts.nl actief is; dan workers_dev = false en
# routes = [{ pattern = "api.okkiedarts.nl", custom_domain = true }], en API_BASE in community/config.js aanpassen.
# Beheer (beheer.okkiedarts.nl) blijft dicht zolang de Access-secrets niet gezet zijn.
[env.production]
name = "okkie-api"
workers_dev = true

[env.production.vars]
ALLOWED_ORIGINS = "https://app.okkiedarts.nl,https://martijndbesten.github.io,https://okkiedarts.nl,https://www.okkiedarts.nl,capacitor://localhost"
ADMIN_HOST = "beheer.okkiedarts.nl"
# Openbare registratie dicht tot privacyverklaring + ouderlijke toestemming (<16) geregeld zijn. Alleen "true" opent.
REGISTRATION_ENABLED = "false"
# Mijn vrienden (besloten groepen) uit sinds 1.5.0; besloten gegevens blijven bewaard en worden nooit automatisch openbaar.
GROUPS_ENABLED = "false"
# Darters: openbaar overzicht, één schakelaar per speler; jonger dan 16 pas na "ja" van een ouder (src/darters.js).
DARTERS_ENABLED = "true"
# OKKIE. Club: live sinds 1.9.0 (migraties 0009 en 0010). Uitzetten: "false" en opnieuw deployen.
CLUBS_ENABLED = "true"
EMPTY_ACCOUNT_DAYS = "30"
INACTIVE_DAYS = "730"

[[env.production.d1_databases]]
binding = "DB"
database_name = "okkie-community"
database_id = "6d496b27-7bc4-4c39-85cb-d77002d578bb"
migrations_dir = "migrations"

[[env.production.ratelimits]]
name = "RL_REGISTER"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

[[env.production.ratelimits]]
name = "RL_WRITE"
namespace_id = "2002"
simple = { limit = 60, period = 60 }
